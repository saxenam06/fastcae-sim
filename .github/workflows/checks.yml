# The checks every change must pass (PLT-2): lint, format, and checks/ on a clean venv.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the venv from the lock
        run: uv sync --all-extras --locked
      - name: Lint
        run: uv run ruff check src checks
      - name: Format
        run: uv run ruff format --check src checks
      - name: Checks
        run: uv run pytest checks -q
