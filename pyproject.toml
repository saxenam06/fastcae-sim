[project]
name = "zenryx"
version = "0.1.0"
description = "Housings designed from requirements: a contract, a deterministic judge, agents that run design campaigns"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.1",
    "scipy>=1.14",
]

[project.optional-dependencies]
# The exact machined core in CadQuery, on the OCP bindings fastcae proved on this machine;
# the field-space structure, its surface and the mesh booleans; pictures.
geometry = [
    "cadquery==2.8.0",
    "cadquery-ocp==7.9.3.1.1",
    "gmsh==4.15.2",
    "manifold3d>=3.0",
    "scikit-image>=0.24",
    "trimesh>=4.5",
    "pyvista>=0.44",
]
# Reading published sources (tables in papers) when an example contract is written.
docs = [
    "pypdf>=5.1",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",  # FastAPI's test client (checks/workflow/test_server.py)
]
solve = [
    "cupy-cuda12x[ctk]==14.2.0",
    "nvidia-cudss-cu12==0.8.0.10",
    "nvmath-python[cu12]==1.0.0",
]
# The API the UI's Run button calls (PLT-5), and RunPod's storage for the optimisation run there
# (PLT-12; its job API is plain HTTPS).
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zenryx"]

[tool.ruff]
line-length = 100
src = ["src", "checks", "prototypes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["checks"]
